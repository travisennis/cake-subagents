name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Vet
        run: |
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
          sh -n bin/install bin/uninstall bin/doctor hooks/subagent-reports.sh .githooks/commit-msg
      - name: Test
        run: |
          go build -o dist/cake-subagent ./cmd/cake-subagent
          ln -sfn cake-subagent dist/subagent
          CAKE_SUBAGENT_TOOLS="$PWD/dist" python3 -m unittest discover -s tests -v
